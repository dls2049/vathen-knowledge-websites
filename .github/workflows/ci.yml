name: Validate website and Task Bridge
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required entry points
        run: |
          test -s index.html
          test -s knowledge-hub/index.html
          test -s knowledge-library/index.html
          test -s knowledge-hub/engineering/index.html
          test -s .github/workflows/pages.yml
      - name: Check JSON manifests
        run: python -c "import json,pathlib; [json.loads(p.read_text()) for p in pathlib.Path('.').rglob('manifest.json')]"
  task-bridge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r task-bridge/requirements.txt
      - run: PYTHONPATH=task-bridge pytest -q task-bridge/tests
